name: Mirror release to GitHub

on:
  release:
    types: [published]

jobs:
  mirror:
    runs-on: docker
    steps:
      # Only here so the failure reporter below has the script on disk;
      # the release call itself needs nothing from the working tree.
      - uses: actions/checkout@v7

      - name: Create matching GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          REPO: redeuxx/whitespace
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
          NAME: ${{ github.event.release.name }}
          BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DRAFT: ${{ github.event.release.draft }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "$(jq -n \
                  --arg tag "$TAG" \
                  --arg target "$TARGET" \
                  --arg name "$NAME" \
                  --arg body "$BODY" \
                  --argjson prerelease "$PRERELEASE" \
                  --argjson draft "$DRAFT" \
                  '{tag_name:$tag, target_commitish:$target, name:$name, body:$body, prerelease:$prerelease, draft:$draft}')"

      - name: Report failure
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.FJ_API_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1
          FORGEJO_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: ./.forgejo/notify-failure.sh
