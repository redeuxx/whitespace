name: Build and publish image

# Builds the image on the runner and pushes it to Forgejo's own container
# registry, so deploying is a pull instead of a build.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the Forgejo container registry
        env:
          # Not secrets.GITHUB_TOKEN: packages are owned by the user, not the
          # repo, so the repo-scoped Actions token authenticates fine but is
          # rejected on push with "unauthorized: reqPackageAccess". This has
          # to be a PAT carrying write:package.
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          # The PAT owner, which is also the package namespace. Not
          # github.actor, which is whoever pushed.
          OWNER: ${{ github.repository_owner }}
        run: echo "$TOKEN" | docker login git.wenberg.net -u "$OWNER" --password-stdin

      - name: Build and push
        env:
          IMAGE: git.wenberg.net/${{ github.repository }}
        run: |
          set -eu

          # Every build gets an immutable sha tag; that is what a rollback
          # pins to. The moving tags below are conveniences on top of it.
          SHA_TAG="${GITHUB_SHA:0:12}"
          docker build -t "$IMAGE:$SHA_TAG" .
          docker push "$IMAGE:$SHA_TAG"

          case "$GITHUB_REF" in
            refs/heads/main) MOVING="latest" ;;
            refs/tags/*)     MOVING="${GITHUB_REF#refs/tags/}" ;;
            *)               MOVING="" ;;
          esac

          if [ -n "$MOVING" ]; then
            docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$MOVING"
            docker push "$IMAGE:$MOVING"
          fi

      - name: Report failure
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.FJ_API_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1
          FORGEJO_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: ./.forgejo/notify-failure.sh
