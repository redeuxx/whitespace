name: Notify selftest
# TEMPORARY. Deleted before this branch merges. Exists only to make a job fail
# on demand so the Report failure step can be exercised against the real API.
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      - name: Fail on purpose
        run: exit 1

      - name: Report failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: ./.forgejo/notify-failure.sh
