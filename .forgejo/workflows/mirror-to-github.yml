name: Mirror main to GitHub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: docker
    steps:
      # fetch-depth: 0 because a shallow clone cannot be pushed; fetch-tags so
      # the tag refspec below has something to send
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # GH_MIRROR_TOKEN needs Workflows: Read and write (the `workflow` scope on
      # a classic token), not just Contents and Pull requests. GitHub rejects
      # any PAT push that creates or updates a file under .github/workflows:
      #
      #   ! [remote rejected] HEAD -> main (refusing to allow a Personal Access
      #   Token to create or update workflow ... without `workflow` scope)
      #
      # That reads like an expired token but is not. It only fires on pushes
      # that touch a workflow file, so the mirror looks healthy in between.
      - name: Push main to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO: redeuxx/whitespace
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

          # --force because Forgejo is the source of truth and GitHub is a
          # mirror; anything committed directly on GitHub is meant to lose.
          # A plain refspec push, unlike the native push mirror's
          # git push --mirror, never prunes branches that only exist on
          # GitHub, so dependabot branches and their PRs survive.
          git push --force "$REMOTE" HEAD:refs/heads/main

          # Tags deliberately without --force: a release tag that needs to
          # move is a mistake worth failing on, not overwriting. They have to
          # be pushed at all because mirror-release.yml creates GitHub
          # releases against tags it assumes already exist there.
          git push "$REMOTE" 'refs/tags/*:refs/tags/*'

      - name: Report failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: ./.forgejo/notify-failure.sh
