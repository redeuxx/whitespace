name: Check lockfile sync

# uv.lock is the only dependency source of truth. requirements.txt used to be
# committed alongside it, and Dependabot treated every pin in that file as an
# explicitly declared dependency: it edited them there and never touched the
# lock, so the image shipped versions uv never resolved. That file is gone and
# the Dockerfile now exports from the lock at build time, which leaves only one
# thing to check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      # v7 on purpose, not v9: data.forgejo.org is where the runner resolves
      # actions from and its mirror lags. See check-action-updates.yml.
      - uses: astral-sh/setup-uv@v7

      - name: uv.lock agrees with pyproject.toml
        run: uv lock --check
