name: Check for action updates

# Dependabot only scans .github/workflows, so nothing watches the actions
# pinned here. Moving major tags like @v7 already pick up minor and patch
# releases on their own; this job exists to catch the major bumps they do not.
#
# It queries data.forgejo.org rather than github.com on purpose. That is where
# the runner resolves actions from, and its mirror lags: astral-sh/setup-uv is
# at v9 upstream but only v7 here, and pinning v9 fails the job outright with
# "could not determine the commit ID of v9^{commit}". Comparing against GitHub
# would report upgrades that cannot actually be used.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      - name: Compare pinned majors against what the runner can fetch
        env:
          REGISTRY: https://data.forgejo.org
        run: |
          set -eu

          grep -rhoE 'uses: [A-Za-z0-9._-]+/[A-Za-z0-9._-]+@v[0-9]+' .forgejo/workflows \
            | sed 's/^uses: //' | sort -u > /tmp/actions.txt

          if [ ! -s /tmp/actions.txt ]; then
            echo "no pinned actions found"
            exit 0
          fi

          outdated=0
          while read -r spec; do
            repo="${spec%@*}"
            current="${spec##*@v}"

            latest=$(git ls-remote --tags "${REGISTRY}/${repo}" 2>/dev/null \
                       | sed -nE 's#.*refs/tags/v([0-9]+)$#\1#p' \
                       | sort -n | tail -1)

            if [ -z "$latest" ]; then
              echo "::warning::${repo} exposes no vN tags on ${REGISTRY}"
              continue
            fi

            if [ "$latest" -gt "$current" ]; then
              echo "::error::${repo} is pinned at v${current} but v${latest} is available"
              outdated=1
            else
              echo "ok: ${repo} v${current} (newest available v${latest})"
            fi
          done < /tmp/actions.txt

          exit "$outdated"

      - name: Report failure
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.FJ_API_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1
          FORGEJO_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: ./.forgejo/notify-failure.sh
