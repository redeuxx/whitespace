[project]
name = "whitespace"
version = "1.0.3"
description = "A self-hosted pastebin built with Flask. Supports syntax highlighting, file attachments, password-protected pastes, expiry options, and an admin panel."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0.0",
    "flask-limiter>=3.5.0",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "pygments>=2.20.0",
    "python-dotenv>=1.0.0",
    "cryptography>=50.0.1",
    "werkzeug>=3.1.8",
    "wtforms>=3.2.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Explicit, because the flat layout puts app/, migrations/ and tests/ side by
# side and setuptools auto-discovery refuses to guess between them.
[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
