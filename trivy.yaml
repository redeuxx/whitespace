# Trivy config, read from the working directory. Scans run locally only.
# Exceptions, when needed, go in .trivyignore (reason and exp:YYYY-MM-DD),
# mirrored in .grype.yaml.
severity:
  - HIGH
  - CRITICAL
exit-code: 1
scan:
  skip-dirs:
    - .venv
    - node_modules
    - uploads
    - tests/uploads_test
