services:
  web:
    # Built from this checkout by `docker compose up -d --build`.
    image: whitespace:latest
    build: .
    ports:
      # Loopback only: the app trusts X-Forwarded-For from one proxy, so it
      # must not be reachable except through that proxy.
      - "127.0.0.1:8118:8118"
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/instance
      - ./.env:/app/.env:ro
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
