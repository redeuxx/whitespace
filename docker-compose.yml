services:
  web:
    # CI publishes this tag; deploy with `docker compose pull && docker compose up -d`.
    # `build` stays so local dev can still `docker compose up --build`.
    image: git.wenberg.net/redeuxx/whitespace:latest
    build: .
    ports:
      - "8118:8118"
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/instance
      - ./.env:/app/.env:ro
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
