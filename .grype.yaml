# Grype config, read from the working directory. Scans run locally only.
# Ignores carry "# expires YYYY-MM-DD" (Grype has no expiry field); any CVE
# Trivy also flags gets the same reason in .trivyignore.
fail-on-severity: high
exclude:
  - ./.venv/**
  - ./node_modules/**
  - ./uploads/**
  - ./tests/uploads_test/**
ignore:
  # Trivy does not flag these, so they have no .trivyignore counterpart.
  # Only 3.14.10 affected, and only with OpenSSL in FIPS mode, which Alpine's
  # OpenSSL is not. Drop once python:3.14-alpine ships 3.14.11.
  # expires 2026-12-15
  - vulnerability: CVE-2026-119170
    package:
      name: python
  # SQLite CLI .recover command injection. The image ships only the library,
  # not the sqlite3 CLI. No fixed Alpine package yet.
  # expires 2027-01-15
  - vulnerability: CVE-2026-119586
    package:
      name: sqlite-libs
  # Session extension changeset overflow. Python's sqlite3 module does not
  # expose the session API. No fixed Alpine package yet.
  # expires 2027-01-15
  - vulnerability: CVE-2026-119379
    package:
      name: sqlite-libs
  # FTS5 overflows. The app creates no FTS5 tables and its database is never
  # user-supplied. No fixed Alpine package yet.
  # expires 2027-01-15
  - vulnerability: CVE-2026-119374
    package:
      name: sqlite-libs
  # expires 2027-01-15
  - vulnerability: CVE-2026-119373
    package:
      name: sqlite-libs
  # OpenSSL 3.5.9 (libssl3/libcrypto3), no fixed Alpine package yet. Only
  # Python's ssl module links the system OpenSSL (cryptography bundles its
  # own), and the app uses it only as an outbound HTTPS client.
  # QUIC server stream state leak and RETIRE_CONNECTION_ID flood. Python's ssl
  # has no QUIC support and the app serves plain HTTP behind a proxy.
  # expires 2027-01-25
  - vulnerability: CVE-2026-124709
  # expires 2027-01-25
  - vulnerability: CVE-2026-107494
  # CMS/PKCS#7 SignedData verification with CRLs. Nothing in the app verifies
  # CMS or PKCS#7 messages.
  # expires 2027-01-25
  - vulnerability: CVE-2026-121482
  # DANE-enabled TLS client crash. Python's ssl never enables DANE.
  # expires 2027-01-25
  - vulnerability: CVE-2026-84786
  # PEM_X509_INFO_read_bio_ex failure into an existing stack. Only reached via
  # the image's own CA bundle, never attacker-supplied PEM.
  # expires 2027-01-25
  - vulnerability: CVE-2026-107493
